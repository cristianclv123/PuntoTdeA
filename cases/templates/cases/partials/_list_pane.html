{% load icons %}
<div class="wa-list-pane">
  <div class="wa-list-header">
    <button class="nav-toggle" type="button" id="nav-toggle" aria-label="Abrir menú" aria-controls="app-sidebar" aria-expanded="false">
      {% icon 'menu' size=20 %}
    </button>
    <div class="wa-list-title">
      <div class="wa-list-heading font-brand">Bandeja</div>
    </div>
  </div>

  <div class="wa-filters-block">
    <div class="wa-filter-group wa-scope-grid" role="tablist" aria-label="Filtros de bandeja">
      <a
        role="tab"
        class="wa-scope-tab {% if active_tab == 'mine' %}active{% endif %}"
        href="{% url 'cases:bandeja' %}?assigned_to=me"
        aria-selected="{% if active_tab == 'mine' %}true{% else %}false{% endif %}"
      >
        Mis chats
        <span class="wa-chip-count" id="count-mine" {% if not mine_count %}hidden{% endif %}>{{ mine_count }}</span>
      </a>
      <a
        role="tab"
        class="wa-scope-tab {% if active_tab == 'unanswered' %}active{% endif %}"
        href="{% url 'cases:bandeja' %}?unanswered=1"
        aria-selected="{% if active_tab == 'unanswered' %}true{% else %}false{% endif %}"
      >
        Sin respuesta
        <span class="wa-chip-count" id="count-unanswered" {% if not unanswered_count %}hidden{% endif %}>{{ unanswered_count }}</span>
      </a>
      <a
        role="tab"
        class="wa-scope-tab {% if active_tab == 'unassigned' %}active{% endif %}"
        href="{% url 'cases:bandeja' %}?unassigned=1"
        aria-selected="{% if active_tab == 'unassigned' %}true{% else %}false{% endif %}"
      >
        Sin asesor
        <span class="wa-chip-count" id="count-unassigned" {% if not unassigned_count %}hidden{% endif %}>{{ unassigned_count }}</span>
      </a>
      <a
        role="tab"
        class="wa-scope-tab {% if active_tab == 'all' %}active{% endif %}"
        href="{% url 'cases:bandeja' %}"
        aria-selected="{% if active_tab == 'all' %}true{% else %}false{% endif %}"
      >
        Todos
      </a>
      <a
        role="tab"
        class="wa-scope-tab {% if active_tab == 'closed' %}active{% endif %}"
        href="{% url 'cases:bandeja' %}?closed=1"
        aria-selected="{% if active_tab == 'closed' %}true{% else %}false{% endif %}"
      >
        Cerrados
        <span class="wa-chip-count" id="count-closed" {% if not closed_count %}hidden{% endif %}>{{ closed_count }}</span>
      </a>
    </div>

    <div class="wa-search">
      {% icon 'search' size=16 %}
      <input type="search" id="wa-search-input" placeholder="Buscar por nombre, teléfono o mensaje" autocomplete="off" aria-label="Buscar conversaciones">
    </div>
  </div>

  <div
    class="conversation-list wa-conversation-list"
    id="conversation-list"
    data-ws-url="{% if request.is_secure %}wss{% else %}ws{% endif %}://{{ request.get_host }}/ws/bandeja/"
    data-active-tab="{{ active_tab }}"
    data-filter-query="{{ filter_query }}"
    data-current-user-id="{{ request.user.id }}"
  >
    {% include "cases/partials/_conversation_rows.html" %}
  </div>

  <div class="wa-list-footer">
    <span id="result-count">{{ result_count }}</span> chats
  </div>
</div>
