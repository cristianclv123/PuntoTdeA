version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=django_password

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 PuntoTdeA.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=django_db
      - DB_USER=django_user
      - DB_PASSWORD=django_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - WIDGET_ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      # Credenciales de Meta WhatsApp Cloud API: se definen en .env, nunca aquí.
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v21.0}
      - META_GRAPH_API_URL=${META_GRAPH_API_URL:-https://graph.facebook.com}
      - META_REQUEST_TIMEOUT=${META_REQUEST_TIMEOUT:-10}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
